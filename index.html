:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --ink: #17251F;
  --muted: #71807A;
  --line: #E1E6E0;
  --accent: #0E6B5C;
  --accent-soft: #E1EFEA;
  --income: #1D7A46;
  --expense: #B4372E;
  --expense-soft: #F7E8E6;
  --income-soft: #E4F2E9;
  --transfer: #5B5EA6;
  --transfer-soft: #EEEEF8;
}
* { box-sizing: border-box; }
.fc-root {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}
.fc-loading { display: flex; align-items: center; justify-content: center; }
.fc-screen { padding-bottom: 84px; }
.fc-page { padding: 16px 16px 8px; }
.fc-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
.fc-muted { color: var(--muted); font-size: 14px; }

.fc-wallet-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.fc-chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 10px 16px; font-size: 15px; white-space: nowrap;
  min-height: 44px; cursor: pointer;
}
.fc-chip-sm { padding: 8px 12px; min-height: 40px; font-size: 14px; }
.fc-chip-on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.fc-chip-missing { border-style: dashed; border-color: var(--transfer); color: var(--transfer); }
.fc-wrap { flex-wrap: wrap; overflow: visible; }

.fc-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.fc-card-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

.fc-balances { margin-bottom: 14px; }
.fc-bal-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fc-bal-row:last-child { border-bottom: none; padding-bottom: 0; }
.fc-bal-cur { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.fc-bal-val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.fc-add-row { display: flex; gap: 8px; }
.fc-big-btn {
  flex: 1; border: none; border-radius: 16px; padding: 18px 0; font-size: 17px; font-weight: 700; cursor: pointer;
}
.fc-btn-exp { background: var(--expense); color: #fff; }
.fc-btn-inc { background: var(--income); color: #fff; }
.fc-btn-tr { background: var(--transfer-soft); color: var(--transfer); font-size: 20px; flex: 0 0 64px; }

.fc-tx {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 8px; cursor: pointer; min-height: 60px;
}
.fc-tx-emoji { font-size: 22px; flex-shrink: 0; }
.fc-tx-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fc-tx-cat { font-size: 15px; font-weight: 600; }
.fc-tx-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-tx-amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fc-tx-cur { font-size: 12px; font-weight: 600; color: var(--muted); }
.fc-pos { color: var(--income); }
.fc-neg { color: var(--expense); }

.fc-date-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
.fc-empty { color: var(--muted); font-size: 14px; padding: 20px 4px; text-align: center; line-height: 1.5; }

.fc-month-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
.fc-month-btn {
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); font-size: 22px; cursor: pointer; color: var(--ink);
}
.fc-month-label { font-size: 18px; font-weight: 700; }
.fc-sum-card { margin-bottom: 10px; }
.fc-sum-cur { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 6px; }
.fc-sum-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.fc-sum-total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; font-weight: 700; }
.fc-sum-transfers { border-color: var(--transfer); }
.fc-tr-label { color: var(--transfer); }
.fc-sum-note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

.fc-row-btn {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 8px; font-size: 15px; cursor: pointer; min-height: 52px;
  color: var(--ink); text-align: left; gap: 8px;
}
.fc-add-link {
  background: none; border: none; color: var(--accent); font-size: 15px; font-weight: 600;
  padding: 12px 4px; cursor: pointer; display: block; text-align: left;
}

.fc-nav {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.fc-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; font-size: 11px; color: var(--muted); cursor: pointer; padding: 6px 0;
}
.fc-nav-icon { font-size: 20px; }
.fc-nav-active { color: var(--accent); font-weight: 700; }

.fc-overlay {
  position: fixed; inset: 0; background: rgba(23, 37, 31, 0.45); z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
}
.fc-sheet {
  background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
  max-height: 92vh; overflow-y: auto; animation: fc-up 0.18s ease-out;
}
@keyframes fc-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fc-sheet { animation: none; } }
.fc-sheet-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 16px 8px; position: sticky; top: 0; background: var(--bg);
}
.fc-sheet-title { font-size: 18px; font-weight: 700; }
.fc-close {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-size: 15px; cursor: pointer; color: var(--muted);
}
.fc-sheet-body { padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); }

.fc-seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.fc-seg-btn { flex: 1; border: none; background: none; border-radius: 11px; padding: 12px 0; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
.fc-seg-on-exp { background: var(--expense-soft); color: var(--expense); }
.fc-seg-on-inc { background: var(--income-soft); color: var(--income); }

.fc-amount-row { display: flex; gap: 10px; align-items: center; }
.fc-amount-input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  font-size: 30px; font-weight: 700; padding: 12px 14px; font-variant-numeric: tabular-nums;
  color: var(--ink); outline-color: var(--accent);
}
.fc-input-err { border-color: var(--expense); }
.fc-err-text { color: var(--expense); font-size: 13px; margin-top: 6px; }
.fc-cur-chips { display: flex; gap: 6px; flex-wrap: wrap; }

.fc-extra { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.fc-input {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: 16px; padding: 13px 14px; color: var(--ink); width: 100%; outline-color: var(--accent);
}

.fc-cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fc-cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 4px; cursor: pointer; min-height: 72px; justify-content: center;
}
.fc-cat-on { border-color: var(--accent); background: var(--accent-soft); }
.fc-cat-emoji { font-size: 24px; }
.fc-cat-name { font-size: 11.5px; color: var(--ink); text-align: center; line-height: 1.15; }

.fc-primary {
  width: 100%; border: none; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  border-radius: 14px; padding: 16px 0; margin-top: 18px; cursor: pointer;
}
.fc-danger-link { background: none; border: none; color: var(--expense); font-size: 15px; font-weight: 600; padding: 14px; width: 100%; cursor: pointer; }
.fc-danger { border: none; background: var(--expense); color: #fff; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
.fc-ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
.fc-confirm { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; background: var(--expense-soft); border-radius: 14px; padding: 14px; font-size: 14px; color: var(--expense); text-align: center; }

.fc-custom-cur { display: flex; gap: 8px; margin-top: 10px; }
.fc-cat-edit-row { display: flex; gap: 8px; }
.fc-emoji-input { width: 64px; text-align: center; font-size: 22px; }

/* Transfer sheet */
.fc-tr-block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 4px; }
.fc-tr-block-label { font-size: 12px; font-weight: 700; color: var(--transfer); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.fc-tr-arrow { text-align: center; color: var(--muted); font-size: 20px; padding: 4px 0; }
.fc-rate-hint { background: var(--transfer-soft); color: var(--transfer); font-size: 14px; font-weight: 600; border-radius: 12px; padding: 10px 14px; margin-top: 10px; text-align: center; }
.fc-add-cur-hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; background: var(--transfer-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--transfer); }

.fc-sub-due { margin-top: 12px; border-color: var(--transfer); }

.fc-toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 20px;
  font-size: 14px; font-weight: 600; z-index: 100; white-space: nowrap;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
