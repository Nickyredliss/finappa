:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --ink: #17251F;
  --muted: #71807A;
  --line: #E1E6E0;
  --accent: #0E6B5C;
  --accent-soft: #E1EFEA;
  --income: #1D7A46;
  --expense: #B4372E;
  --expense-soft: #F7E8E6;
  --income-soft: #E4F2E9;
  --transfer: #5B5EA6;
  --transfer-soft: #EEEEF8;
}

/* \u0422\u0451\u043C\u043D\u0430\u044F \u0442\u0435\u043C\u0430 \u2014 \u0442\u0435 \u0436\u0435 \u0442\u0440\u0438\u043D\u0430\u0434\u0446\u0430\u0442\u044C \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445, \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0438\u0447\u0435\u0433\u043E.
   \u0424\u043E\u043D \u043D\u0435 \u0447\u0451\u0440\u043D\u044B\u0439, \u0430 \u043E\u0447\u0435\u043D\u044C \u0442\u0451\u043C\u043D\u044B\u0439 \u0437\u0435\u043B\u0451\u043D\u043E-\u0441\u0435\u0440\u044B\u0439: \u043D\u0430 OLED \u0447\u0438\u0441\u0442\u044B\u0439 \u0447\u0451\u0440\u043D\u044B\u0439 \u0434\u0430\u0451\u0442
   \u0440\u0435\u0437\u043A\u0443\u044E \u0433\u0440\u0430\u043D\u0438\u0446\u0443 \u0441 \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0430\u043C\u0438 \u0438 \u043C\u044B\u043B\u0438\u0442 \u0442\u0435\u043A\u0441\u0442. \u0410\u043A\u0446\u0435\u043D\u0442 \u0438 \u0446\u0432\u0435\u0442\u0430 \u0441\u0443\u043C\u043C \u043F\u043E\u0434\u043D\u044F\u0442\u044B \u043F\u043E
   \u0441\u0432\u0435\u0442\u043B\u043E\u0442\u0435 \u2014 \u0438\u0441\u0445\u043E\u0434\u043D\u044B\u0435 \u0431\u0440\u0430\u043B\u0438\u0441\u044C \u043F\u043E\u0434 \u0431\u0435\u043B\u044B\u0439 \u0444\u043E\u043D \u0438 \u043D\u0430 \u0442\u0451\u043C\u043D\u043E\u043C \u043D\u0435 \u0447\u0438\u0442\u0430\u044E\u0442\u0441\u044F. */
[data-theme="dark"] {
  --bg: #0F1613;
  --surface: #182220;
  --ink: #E8EFEB;
  --muted: #90A29B;
  --line: #2A3733;
  --accent: #35B99B;
  --accent-soft: #14322C;
  --income: #4BC17F;
  --expense: #F0796B;
  --expense-soft: #33201E;
  --income-soft: #142A1F;
  --transfer: #9AA0E8;
  --transfer-soft: #1E2038;
}
/* \u041A\u0440\u0443\u0436\u043A\u0438 \u0432\u0430\u043B\u044E\u0442 \u0437\u0430\u0434\u0430\u043D\u044B \u0444\u0438\u043A\u0441\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u043C\u0438 \u0446\u0432\u0435\u0442\u0430\u043C\u0438 \u043F\u043E\u0434 \u0431\u0435\u043B\u044B\u0439 \u0444\u043E\u043D \u2014 \u043D\u0430 \u0442\u0451\u043C\u043D\u043E\u043C \u0438\u0445
   \u043D\u0430\u0434\u043E \u043F\u043E\u0434\u043D\u044F\u0442\u044C, \u0438\u043D\u0430\u0447\u0435 THB \u043F\u0440\u0435\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044F \u0432 \u0447\u0451\u0440\u043D\u0443\u044E \u0442\u043E\u0447\u043A\u0443. */
[data-theme="dark"] .fc-cur-dot { filter: brightness(1.55) saturate(1.1); }
/* \u041A\u043D\u043E\u043F\u043A\u0438 \u043D\u0430 \u0430\u043A\u0446\u0435\u043D\u0442\u043D\u043E\u043C \u0444\u043E\u043D\u0435: \u043D\u0430 \u0441\u0432\u0435\u0442\u043B\u043E\u043C \u0430\u043A\u0446\u0435\u043D\u0442\u0435 \u0431\u0435\u043B\u044B\u0439 \u0442\u0435\u043A\u0441\u0442, \u043D\u0430 \u0442\u0451\u043C\u043D\u043E\u043C \u2014
   \u0442\u0451\u043C\u043D\u044B\u0439, \u0438\u043D\u0430\u0447\u0435 \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442\u0441\u044F \u0441\u0432\u0435\u0442\u043B\u043E\u0435 \u043D\u0430 \u0441\u0432\u0435\u0442\u043B\u043E\u043C. */
[data-theme="dark"] .fc-primary,
[data-theme="dark"] .fc-chip-on,
[data-theme="dark"] .fc-seg-on-period { color: #0F1613; }
[data-theme="dark"] .fc-btn-exp,
[data-theme="dark"] .fc-btn-inc,
[data-theme="dark"] .fc-danger { color: #0F1613; }
[data-theme="dark"] .fc-toast { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
* { box-sizing: border-box; }
.fc-root {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}
.fc-loading { display: flex; align-items: center; justify-content: center; }
.fc-screen { padding-bottom: 84px; }
.fc-page { padding: 16px 16px 8px; }
.fc-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
.fc-muted { color: var(--muted); font-size: 14px; }

.fc-wallet-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.fc-chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 10px 16px; font-size: 15px; white-space: nowrap;
  min-height: 44px; cursor: pointer;
}
.fc-chip-sm { padding: 8px 12px; min-height: 40px; font-size: 14px; }
.fc-chip-on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.fc-chip-missing { border-style: dashed; border-color: var(--transfer); color: var(--transfer); }
.fc-wrap { flex-wrap: wrap; overflow: visible; }

.fc-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.fc-card-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

.fc-balances { margin-bottom: 14px; }
.fc-bal-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fc-bal-row:last-child { border-bottom: none; padding-bottom: 0; }
.fc-bal-cur { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.fc-bal-val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.fc-add-row { display: flex; gap: 8px; }
.fc-big-btn {
  flex: 1; border: none; border-radius: 16px; padding: 18px 0; font-size: 17px; font-weight: 700; cursor: pointer;
}
.fc-btn-exp { background: var(--expense); color: #fff; }
.fc-btn-inc { background: var(--income); color: #fff; }
.fc-btn-tr { background: var(--transfer-soft); color: var(--transfer); font-size: 20px; flex: 0 0 64px; }

.fc-tx {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 8px; cursor: pointer; min-height: 60px;
}
.fc-tx-emoji { font-size: 22px; flex-shrink: 0; }
.fc-tx-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fc-tx-cat { font-size: 15px; font-weight: 600; }
.fc-tx-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-tx-amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fc-tx-cur { font-size: 12px; font-weight: 600; color: var(--muted); }
.fc-pos { color: var(--income); }
.fc-neg { color: var(--expense); }

.fc-date-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
.fc-empty { color: var(--muted); font-size: 14px; padding: 20px 4px; text-align: center; line-height: 1.5; }

.fc-month-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
.fc-month-btn {
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); font-size: 22px; cursor: pointer; color: var(--ink);
}
.fc-month-label { font-size: 18px; font-weight: 700; }
.fc-sum-card { margin-bottom: 10px; }
/* \u0422\u0417-18. \u041A\u043E\u0434 \u0432\u0430\u043B\u044E\u0442\u044B \u0441\u0442\u043E\u0438\u0442 \u0443 \u0441\u0430\u043C\u043E\u0433\u043E \u0447\u0438\u0441\u043B\u0430, \u0430 \u043D\u0435 \u0442\u043E\u043B\u044C\u043A\u043E \u0432 \u0448\u0430\u043F\u043A\u0435 \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0438:
   \u0448\u0430\u043F\u043A\u0430 \u0443\u0435\u0437\u0436\u0430\u0435\u0442 \u043F\u0440\u0438 \u043F\u0440\u043E\u043A\u0440\u0443\u0442\u043A\u0435, \u0438 \u0447\u0435\u043B\u043E\u0432\u0435\u043A \u043F\u0435\u0440\u0435\u0441\u0442\u0430\u0451\u0442 \u043F\u043E\u043D\u0438\u043C\u0430\u0442\u044C, \u0447\u0442\u043E \u0447\u0438\u0442\u0430\u0435\u0442. */
.fc-cur-suf { font-size: 0.82em; opacity: 0.75; font-weight: 600; }
.fc-sum-seg { margin-bottom: 10px; }
.fc-sum-exact { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.fc-sum-exact-head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.fc-sum-exact-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
.fc-sum-norate { margin-bottom: 10px; font-size: 13px; color: var(--muted); }
/* \u0422\u0417-17. \u0421\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u044C \u0436\u0438\u0437\u043D\u0438 \u2014 \u0441\u0432\u043E\u0439\u0441\u0442\u0432\u043E \u0436\u0438\u0437\u043D\u0438, \u0430 \u043D\u0435 \u043C\u0435\u0441\u044F\u0446\u0430, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0447\u0435\u043B\u043E\u0432\u0435\u043A
   \u043B\u0438\u0441\u0442\u0430\u0435\u0442, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0430 \u0441\u0442\u043E\u0438\u0442 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u043E \u0438 \u043D\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043E\u0442 \u043D\u0430\u0432\u0438\u0433\u0430\u0446\u0438\u0438. */
.fc-cost-card { margin-bottom: 10px; }
.fc-cost-main { font-weight: 700; font-size: 17px; margin-top: 4px; }
.fc-cost-free { margin-top: 6px; }
.fc-cost-note { font-size: 13px; color: var(--muted); text-align: right; margin-top: 2px; }
.fc-cost-hint { font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.fc-cost-wait { font-size: 14px; color: var(--ink); margin-top: 4px; }
.fc-make-sub { width: 100%; margin-top: 10px; }
/* \u041F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0436\u0434\u0435\u043D\u0438\u0435 \u043E \u0434\u0443\u0431\u043B\u0435: \u0437\u0430\u043C\u0435\u0442\u043D\u043E\u0435, \u043D\u043E \u043D\u0435 \u0442\u0440\u0435\u0432\u043E\u0436\u043D\u043E\u0435 \u2014 \u044D\u0442\u043E \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0430, \u0430 \u043D\u0435
   \u043E\u0448\u0438\u0431\u043A\u0430, \u0438 \u0447\u0435\u043B\u043E\u0432\u0435\u043A \u0438\u043C\u0435\u0435\u0442 \u043F\u0440\u0430\u0432\u043E \u0441\u043E\u0445\u0440\u0430\u043D\u0438\u0442\u044C \u0437\u0430\u043F\u0438\u0441\u044C \u0432\u0441\u0451 \u0440\u0430\u0432\u043D\u043E. */
.fc-dup-note {
  margin-top: 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--expense-soft); color: var(--ink); font-size: 14px; line-height: 1.4;
}
.fc-dup-drop { margin-top: 8px; width: 100%; }
.fc-sum-cur { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 6px; }
.fc-sum-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; font-variant-numeric: tabular-nums; }
.fc-cat-stats { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.fc-cat-stats-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.fc-cat-stats-head .fc-muted { font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.fc-cat-stat { padding: 5px 0; }
.fc-cat-stat-row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.fc-cat-stat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-cat-stat-nums { flex-shrink: 0; }
.fc-cat-stat-nums .fc-muted { font-size: 13px; }
.fc-delta-up { color: var(--expense); font-size: 12px; }
.fc-delta-down { color: var(--income); font-size: 12px; }
.fc-bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.fc-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

.fc-drafts {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 12px 14px;
  margin-top: 18px;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
.fc-drafts-ico { font-size: 20px; }
.fc-drafts-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fc-drafts-title { font-weight: 600; }
.fc-drafts-go { color: var(--accent); font-size: 20px; }

.fc-draft-row { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; }
.fc-draft-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  min-width: 0;
}
.fc-draft-text { font-weight: 600; word-break: break-word; }
.fc-draft-del {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 16px;
  padding: 2px 4px;
  cursor: pointer;
}
.fc-draft-src {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 9px 12px;
  margin-bottom: 12px;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
}
.fc-auto-steps {
  margin: 10px 0;
  padding-left: 20px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
.fc-auto-steps li { margin-bottom: 4px; }
.fc-auto-url {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 11px;
  margin-bottom: 10px;
  word-break: break-all;
}

.fc-sum-total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; font-weight: 700; }
.fc-sum-transfers { border-color: var(--transfer); }
.fc-tr-label { color: var(--transfer); }
.fc-sum-note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

.fc-row-btn {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 8px; font-size: 15px; cursor: pointer; min-height: 52px;
  color: var(--ink); text-align: left; gap: 8px;
}
.fc-add-link {
  background: none; border: none; color: var(--accent); font-size: 15px; font-weight: 600;
  padding: 12px 4px; cursor: pointer; display: block; text-align: left;
}

.fc-nav {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.fc-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; font-size: 11px; color: var(--muted); cursor: pointer; padding: 6px 0;
}
.fc-nav-icon { font-size: 20px; }
.fc-nav-active { color: var(--accent); font-weight: 700; }

.fc-overlay {
  position: fixed; inset: 0; background: rgba(23, 37, 31, 0.45); z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
}
.fc-sheet {
  background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
  max-height: 92vh; overflow-y: auto; animation: fc-up 0.18s ease-out;
}
@keyframes fc-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fc-sheet { animation: none; } }
.fc-sheet-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 16px 8px; position: sticky; top: 0; background: var(--bg);
}
.fc-sheet-title { font-size: 18px; font-weight: 700; }
.fc-close {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-size: 15px; cursor: pointer; color: var(--muted);
}
.fc-sheet-body { padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); }

.fc-seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.fc-seg-btn { flex: 1; border: none; background: none; border-radius: 11px; padding: 12px 0; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; }
.fc-seg-on-exp { background: var(--expense-soft); color: var(--expense); }
.fc-seg-on-inc { background: var(--income-soft); color: var(--income); }

.fc-amount-row { display: flex; gap: 10px; align-items: center; }
.fc-amount-input {
  flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  font-size: 30px; font-weight: 700; padding: 12px 14px; font-variant-numeric: tabular-nums;
  color: var(--ink); outline-color: var(--accent);
}
.fc-input-err { border-color: var(--expense); }
.fc-err-text { color: var(--expense); font-size: 13px; margin-top: 6px; }
.fc-cur-chips { display: flex; gap: 6px; flex-wrap: wrap; }

.fc-extra { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.fc-input {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: 16px; padding: 13px 14px; color: var(--ink); width: 100%; outline-color: var(--accent);
}

.fc-cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fc-cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 4px; cursor: pointer; min-height: 72px; justify-content: center;
}
.fc-cat-on { border-color: var(--accent); background: var(--accent-soft); }
.fc-cat-emoji { font-size: 24px; }
.fc-cat-name { font-size: 11.5px; color: var(--ink); text-align: center; line-height: 1.15; }

.fc-primary {
  width: 100%; border: none; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  border-radius: 14px; padding: 16px 0; margin-top: 18px; cursor: pointer;
}
.fc-danger-link { background: none; border: none; color: var(--expense); font-size: 15px; font-weight: 600; padding: 14px; width: 100%; cursor: pointer; }
.fc-danger { border: none; background: var(--expense); color: #fff; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
.fc-ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
.fc-confirm { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; background: var(--expense-soft); border-radius: 14px; padding: 14px; font-size: 14px; color: var(--expense); text-align: center; }

.fc-custom-cur { display: flex; gap: 8px; margin-top: 10px; }
.fc-cat-edit-row { display: flex; gap: 8px; }
.fc-emoji-input { width: 64px; text-align: center; font-size: 22px; }

/* Transfer sheet */
.fc-tr-block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 4px; }
.fc-tr-block-label { font-size: 12px; font-weight: 700; color: var(--transfer); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
.fc-tr-arrow { text-align: center; color: var(--muted); font-size: 20px; padding: 4px 0; }
.fc-rate-hint { background: var(--transfer-soft); color: var(--transfer); font-size: 14px; font-weight: 600; border-radius: 12px; padding: 10px 14px; margin-top: 10px; text-align: center; }
.fc-add-cur-hint { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; background: var(--transfer-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--transfer); }

.fc-sub-row { margin-top: 10px; padding: 12px 16px; }
.fc-sub-due { border-color: var(--transfer); }
.fc-sub-info { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; border: none; background: none; padding: 0; text-align: left; cursor: pointer; }
.fc-sub-name { font-weight: 700; font-size: 15px; }
.fc-sub-empty, .fc-goal-empty {
  margin-top: 10px; padding: 12px 16px; width: 100%; display: flex; flex-direction: column;
  align-items: flex-start; gap: 4px; text-align: left; cursor: pointer; border-style: dashed;
}

/* \u0426\u0435\u043B\u0438 */
.fc-bal-free {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 13px; color: var(--muted); padding: 0 0 8px; margin-top: -4px;
}
.fc-bal-free .fc-neg { color: var(--expense); font-weight: 700; }
.fc-goal-row {
  margin-top: 10px; padding: 12px 16px; width: 100%; display: flex; flex-direction: column;
  align-items: stretch; gap: 6px; text-align: left; cursor: pointer;
}
.fc-goal-closed { opacity: 0.55; }
.fc-goal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.fc-goal-pct { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.fc-goal-bar { display: block; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fc-goal-fill { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.fc-goal-stat { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-top: 8px; }

.fc-tmpl-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
.fc-tmpl-chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto;
  min-width: 84px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px; cursor: pointer;
}
.fc-tmpl-emoji { font-size: 20px; }
.fc-tmpl-label { font-size: 12px; font-weight: 600; color: var(--ink); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-tmpl-amt { font-size: 12px; color: var(--muted); }

.fc-toast {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 20px;
  font-size: 14px; font-weight: 600; z-index: 100; white-space: nowrap;
}
/* \u041E\u0431\u0449\u0438\u0435 \u043A\u043E\u0448\u0435\u043B\u044C\u043A\u0438 */
.fc-code {
  font-size: 30px; font-weight: 800; letter-spacing: 0.14em; text-align: center;
  padding: 8px 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.fc-code-input { text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.fc-badge {
  display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700;
  color: var(--transfer); background: var(--transfer-soft);
  border-radius: 999px; padding: 2px 8px; vertical-align: middle; white-space: nowrap;
}
.fc-member {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 6px; font-size: 15px;
}
.fc-member-off {
  border: none; background: none; color: var(--expense);
  font-size: 14px; font-weight: 600; padding: 4px 6px; cursor: pointer; white-space: nowrap;
}
.fc-member-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.fc-author-seg { margin-bottom: 10px; }

/* \u0426\u0432\u0435\u0442 \u0432\u0430\u043B\u044E\u0442\u044B */
.fc-cur { display: inline-flex; align-items: center; gap: 5px; }
.fc-cur-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.fc-chip-on .fc-cur-dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85); }

/* \xAB\u041F\u043E\u0434\u0435\u043B\u0438\u0442\u044C\u0441\u044F\xBB \u2014 \u043F\u0440\u044F\u043C\u043E \u043D\u0430 \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0435 \u043A\u043E\u0448\u0435\u043B\u044C\u043A\u0430 */
.fc-bal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.fc-share-btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; min-height: 36px; flex-shrink: 0;
}
.fc-share-btn-on { background: var(--transfer-soft); border-color: var(--transfer); color: var(--transfer); }

.fc-file-note { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.45; }

/* \u0422\u0417-7: \u0438\u0442\u043E\u0433\u0438 \u0437\u0430 \u043F\u0435\u0440\u0438\u043E\u0434, \u043F\u043E\u0438\u0441\u043A, \u0437\u0430\u0433\u043E\u043B\u043E\u0432\u043A\u0438 \u0434\u043D\u0435\u0439 \u0441 \u0438\u0442\u043E\u0433\u043E\u043C */
.fc-period { padding: 12px 14px 10px; margin-bottom: 12px; }
.fc-period-seg { margin-bottom: 8px; }
.fc-period-seg .fc-seg-btn { padding: 8px 0; font-size: 14px; }
.fc-seg-on-period { background: var(--accent); color: #fff; }
.fc-period-nav { margin: 0 0 8px; }
.fc-period-nav .fc-month-btn { width: 34px; height: 34px; }
.fc-period-nav .fc-month-btn:disabled { opacity: 0.35; cursor: default; }
.fc-period-label { font-size: 15px; font-weight: 700; }
.fc-period-sum { font-weight: 700; font-variant-numeric: tabular-nums; }
.fc-period-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 4px 0 2px; }
.fc-sum-part { white-space: nowrap; }
.fc-search { margin-bottom: 2px; }
.fc-day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 14px 0 6px; }
.fc-day-head .fc-date-label { margin: 0; }
.fc-day-total { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
